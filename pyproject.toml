[project]
name = "mesh-activity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "josias-r", email = "josias.ribi@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["dotenv>=0.9.9", "paho-mqtt>=2.2.0"]

[project.scripts]
mesh-analyzer = "mesh_activity.analyzer.analyzer:main"
